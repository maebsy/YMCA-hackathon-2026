name: "✨ 기능"
description: 새 기능이나 화면을 만듭니다
title: "[기능] "
labels: ["type: feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요
      description: 사용자의 어떤 문제를 푸나요? 데모 흐름의 어디에 쓰이나요?
      placeholder: 예) 업로드한 파일의 위험도를 바로 보여줘야 데모 2단계로 넘어갈 수 있습니다
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크리스트로 쪼개 주세요. 한 항목은 2시간 안에 끝낼 크기가 좋습니다.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝인가요? 리뷰어가 확인할 수 있게 적어 주세요.
      placeholder: 예) /api/check 에 이미지를 올리면 판별 결과와 근거가 3초 안에 나온다
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 (데모 필수)
        - P1 (중요)
        - P2 (있으면 좋음)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 파트
      options:
        - AI·모델
        - 데이터
        - 백엔드
        - 프론트·데모
        - 인프라
        - 문서·발표
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: 참고 자료
      description: 관련 이슈, 링크, 스케치 (선택)
