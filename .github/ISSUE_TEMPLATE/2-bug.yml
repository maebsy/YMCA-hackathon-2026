name: "🐛 버그"
description: 동작이 잘못됐거나 에러가 납니다
title: "[버그] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 문제인가요
      placeholder: 예) 5MB 넘는 이미지를 올리면 화면이 계속 로딩 중으로 멈춤
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 다른 팀원이 그대로 따라 하면 같은 문제가 나도록 적어 주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 어디서 났나요
      options:
        - 로컬 PC
        - GPU 서버
        - 일반 서버
        - 데모 화면
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 에러 로그
      description: 붙여 넣으면 코드 블록으로 바뀝니다. 키·토큰·개인정보는 지우고 붙이세요.
      render: shell
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 (데모 필수)
        - P1 (중요)
        - P2 (있으면 좋음)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 파트
      options:
        - AI·모델
        - 데이터
        - 백엔드
        - 프론트·데모
        - 인프라
        - 문서·발표
    validations:
      required: true
