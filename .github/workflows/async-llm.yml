name: Async LLM integration

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/migrations/**'
      - 'docs/db-schema.sql'
      - '.github/workflows/async-llm.yml'

permissions:
  contents: read

jobs:
  async-llm-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Auth and durable PostgreSQL queue
        working-directory: backend
        env:
          ASYNC_JOB_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
          LLM_JOBS_ENABLED: 'false'
        run: |
          pip install -r requirements-dev.txt
          pytest -q tests/test_job_auth.py tests/test_explain_jobs.py
