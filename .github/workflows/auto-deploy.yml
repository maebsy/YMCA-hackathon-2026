name: Deployment controller
on:
  pull_request:
    paths: ['deploy/general-server/auto-deploy/**', '.github/workflows/auto-deploy.yml']
  push:
    branches: [main]
    paths: ['deploy/general-server/auto-deploy/**', '.github/workflows/auto-deploy.yml']
permissions:
  contents: read
jobs:
  deployment-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy/general-server/auto-deploy -p 'test_*.py' -v
      - run: bash -n deploy/general-server/auto-deploy/install.sh
      - run: pip install -r backend/requirements.txt
      - run: python ../deploy/general-server/auto-deploy/verify_runtime.py
        working-directory: backend
