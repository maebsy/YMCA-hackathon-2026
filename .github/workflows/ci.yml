name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# job 이름(name)은 main 보호 규칙의 필수 검사 이름과 같아야 합니다.
jobs:
  frontend-unit:
    name: frontend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 파이썬 치명적 오류 검사 (문법 오류, 정의되지 않은 이름)
        run: pipx run ruff check --select E9,F63,F7,F82 --output-format=github .

  # 필수 검사는 아닙니다. 실제 LLM 없이 가짜 vLLM 응답으로 백엔드를 검사합니다
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 백엔드 테스트 (pytest)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API 키·토큰 유출 검사 (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
