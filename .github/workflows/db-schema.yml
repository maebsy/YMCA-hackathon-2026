name: DB schema contract
on:
  pull_request:
    paths:
      - 'docs/db-schema.sql'
      - 'tests/db/**'
      - '.github/workflows/db-schema.yml'
permissions:
  contents: read
jobs:
  db-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/db -q
        env:
          DB_SCHEMA_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
