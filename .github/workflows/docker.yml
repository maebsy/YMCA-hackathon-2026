name: Docker

on:
  pull_request:
    paths:
      - compose.yaml
      - backend/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - compose.yaml
      - backend/**
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# 필수 검사가 아닙니다. backend 나 compose 파일이 바뀐 PR에서만 돕니다.
jobs:
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 파일 문법 검사
        run: docker compose config --quiet
      - name: 빌드 폴더에 가짜 .env 넣기 (.dockerignore 가 이미지에서 빼는지 확인용)
        run: echo "FAKE_SECRET=should-not-be-in-image" > backend/.env
      - name: 이미지 빌드, 실행, 헬스체크 통과까지 대기
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: API 응답 확인 (PostgreSQL 연결 포함)
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"db":"postgresql"'
      - name: 보안 기본값 확인 (비root 실행, 포트는 127.0.0.1에만, .env 는 이미지에 없음)
        run: |
          uid=$(docker compose exec -T backend id -u)
          echo "backend uid=$uid"
          test "$uid" != "0"
          docker compose port backend 8000 | tee /dev/stderr | grep -q '^127\.0\.0\.1:'
          docker compose port db 5432 | tee /dev/stderr | grep -q '^127\.0\.0\.1:'
          docker compose exec -T backend sh -c 'test ! -e /srv/backend/.env'
      - name: LLM 주소 확인 (컨테이너에서 내 PC의 8001로 연결)
        run: |
          docker compose exec -T backend printenv LLM_BASE_URL | tee /dev/stderr | grep -qx 'http://host.docker.internal:8001/v1'
          docker compose exec -T backend getent hosts host.docker.internal
      - name: 코드 저장이 컨테이너에 바로 반영되는지 확인 (compose watch)
        run: |
          docker compose watch --no-up > watch.log 2>&1 &
          sleep 5
          printf '\n\n@app.get("/__watch_probe")\ndef watch_probe():\n    return {"ok": True}\n' >> backend/app/main.py
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/__watch_probe; then
              echo " -> ${i}초 만에 반영"
              exit 0
            fi
            sleep 1
          done
          cat watch.log
          docker compose logs backend
          exit 1
      - name: 실패하면 로그 출력
        if: failure()
        run: docker compose logs
      - name: 정리
        if: always()
        run: docker compose down --volumes
