name: PR 규칙

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# job 이름(name)은 main 보호 규칙의 필수 검사 이름과 같아야 합니다. 바꾸면 보호 규칙도 같이 바꾸세요.
jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PR 제목 검사 (Squash 머지 때 main의 커밋 제목이 됨)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-msg.sh "$PR_TITLE"

  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치 이름 검사
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|style|chore|ci|build|revert|data|model|exp|hotfix)/[a-z0-9][a-z0-9._-]*$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "✅ $BRANCH"
            exit 0
          fi
          echo "::error::브랜치 이름이 규칙에 맞지 않습니다: $BRANCH"
          echo "형식: <타입>/<이슈번호>-<짧은-설명>   예) feat/12-upload-api"
          echo "영문 소문자, 숫자, - _ . 만 쓸 수 있습니다. 이름 바꾸는 법은 CONTRIBUTING.md 8장을 보세요."
          exit 1

  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 안의 모든 커밋 메시지 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            bash scripts/check-commit-msg.sh "$subject" || fail=1
          done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          if (( fail )); then
            echo "::error::규칙에 맞지 않는 커밋이 있습니다. 고치는 법은 CONTRIBUTING.md 8장을 보세요."
          fi
          exit "$fail"

  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - name: 연결된 이슈 검사
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",no-issue,"* ]]; then
            echo "no-issue 라벨이 있어 건너뜁니다."
            exit 0
          fi
          if grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]*:?[[:space:]]*#[0-9]+' <<< "$PR_BODY"; then
            echo "✅ 이슈 연결 확인"
            exit 0
          fi
          echo "::error::PR 본문에 'Closes #이슈번호'를 적어 주세요. 이슈 없는 작은 수정이면 no-issue 라벨을 붙이세요."
          exit 1
