name: Security engine on Windows
on:
  pull_request:
    paths:
      - 'security_engine/**'
      - 'tests/security/**'
      - 'scripts/security/**'
      - '.github/workflows/security-engine.yml'
permissions:
  contents: read
jobs:
  security-engine-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/security/requirements.txt
      - name: Verified scanner installation
        shell: pwsh
        run: |
          python scripts/security/install-test-tools.py --destination "$env:RUNNER_TEMP/scanners"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SECURITY_ENGINE_OSV_BIN=$env:RUNNER_TEMP/scanners/osv-scanner_windows_amd64.exe" >> $env:GITHUB_ENV
          "SECURITY_ENGINE_SEMGREP_BIN=$env:RUNNER_TEMP/scanners/opengrep_windows_x86.exe" >> $env:GITHUB_ENV
          "SECURITY_ENGINE_GITLEAKS_BIN=$env:RUNNER_TEMP/scanners/gitleaks.exe" >> $env:GITHUB_ENV
          "PYTHONUTF8=1" >> $env:GITHUB_ENV
      - name: Doctor and real scanner regression tests
        shell: pwsh
        run: |
          python -m security_engine doctor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "from security_engine import doctor; d=doctor(); assert all(v['path'] for v in d.values()); assert all(d[t]['version'] for t in ('osv','semgrep','gitleaks'))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest tests/security -q --junitxml=outputs/security-tests.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import xml.etree.ElementTree as E; r=E.parse('outputs/security-tests.xml'); assert all(int(s.get('skipped','0')) == 0 for s in r.iter('testsuite')), 'Scanner tests must not silently skip'"
