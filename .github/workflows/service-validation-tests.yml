name: Service validation tool tests
on:
  pull_request:
    paths:
      - 'scripts/service-validation/**'
      - '.github/workflows/service-validation-tests.yml'
permissions:
  contents: read
jobs:
  validation-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/service-validation -p test_validation.py -v
