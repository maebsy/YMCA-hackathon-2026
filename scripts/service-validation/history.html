<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>72hours 검증 기록 보관소</title><style>
body{font:16px/1.6 system-ui;background:#0c1220;color:#e6edf8;max-width:1160px;margin:40px auto;padding:24px}a{color:#a9c9ff}section{background:#151e30;border:1px solid #34415c;border-radius:12px;padding:20px;margin:20px 0}h1{font-size:36px}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #34415c}summary{cursor:pointer}.scroll{overflow-x:auto}
</style><h1>검증 기록 보관소</h1><p>실행별 결과와 반복 실패를 팀원이 재현·수정에 활용할 수 있도록 보관합니다.</p><a href="/validation/">최신 실행 보기</a> · <a href="/validation/history.json">전체 이력 JSON</a><p id="notice">불러오는 중…</p><section><h2>반복 실패와 확인된 원인</h2><div id="problems"></div></section><section><h2>실행 이력</h2><div class="scroll"><table><thead><tr><th>실행 시각(KST)</th><th>상태</th><th>검사 수</th><th>통과/실패/검토/미실행</th><th>산출물</th></tr></thead><tbody id="runs"></tbody></table></div></section>
<script>
function n(t,s){const e=document.createElement(t);if(s!==undefined)e.textContent=typeof s==='string'?s:JSON.stringify(s,null,2);return e;}
function link(p,url,text){const a=n('a',text);a.href=url;p.append(a,document.createTextNode(' '));}
async function refresh(){try{const r=await fetch('/validation/history.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();document.getElementById('notice').textContent=d.notice;const rows=document.getElementById('runs');rows.replaceChildren();const groups=new Map();for(const run of d.runs){const row=n('tr');row.append(n('td',new Date(run.started_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})),n('td',run.status),n('td',run.cases),n('td',[run.counts.pass,run.counts.fail,run.counts.warn,run.counts.skipped].join(' / ')));const cell=n('td');link(cell,run.path,'상세');link(cell,run.path.replace('index.html','results.json'),'JSON');if(run.failures.length)link(cell,run.path.replace('index.html','handoff.md'),'인계문서');row.append(cell);rows.append(row);for(const f of run.failures){const g=groups.get(f.signature)||{latest:f,path:run.path,count:0,runs:new Set()};g.count++;g.runs.add(run.id);groups.set(f.signature,g);}}const problems=document.getElementById('problems');problems.replaceChildren();for(const g of groups.values()){const f=g.latest;const detail=n('details');detail.append(n('summary',`${f.repository||'서비스'} · ${f.stage} · ${f.code} · ${g.runs.size}회 실행/${g.count}건 관측`),n('p',f.cause_status==='confirmed'?'로그로 확인된 원인':'원인 미확정'),n('p',f.cause),n('p','다음 작업: '+f.next_action),n('pre',{job_id:f.job_id,evidence:f.evidence,reproduce:f.reproduce}));link(detail,g.path,'최근 발생 실행');if(/^https:\/\/github\.com\/maebsy\/YMCA-hackathon-2026\/issues\/\d+$/.test(f.issue||''))link(detail,f.issue,'관련 이슈');problems.append(detail);}if(!groups.size)problems.append(n('p','기록된 실패 상세가 없습니다. 이전 형식 실행의 실패는 개별 결과에서 확인하세요.'));}catch{document.getElementById('notice').textContent='이력 조회 실패. 마지막 표시 내용은 유지합니다.'}}
refresh();setInterval(refresh,30000);
</script></html>
