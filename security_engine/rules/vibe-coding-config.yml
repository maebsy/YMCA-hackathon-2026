# 바이브코딩 사이트의 DB·백엔드 서비스 설정 파일(SQL 마이그레이션, Firebase 보안 규칙) 검사 — 우리 팀이 직접 작성.
# 코드 규칙(vibe-coding.yml)과 파일을 나눈 이유: 'semgrep --test'가 같은 이름의 테스트 파일에 모든 규칙을 돌리는데,
# Firebase 규칙 파일은 JavaScript 문법이 아니라서 코드 규칙과 섞으면 테스트가 깨진다.
#
# 테스트: semgrep --test --metrics=off security_engine/rules  (vibe-coding-config.sql, vibe-coding-config.rules)
rules:
  # ---------------------------------------------------------------- DB 보안 설정
  - id: supabase-rls-disabled
    languages: [generic]
    severity: ERROR
    message: >-
      테이블의 RLS(행 단위 보안)를 끄고 있습니다. Supabase는 브라우저에서 바로 DB에 접근하므로,
      RLS가 꺼져 있으면 anon 키만 있어도 누구나 이 테이블을 읽고 고칠 수 있습니다.
    pattern-regex: (?i)disable\s+row\s+level\s+security
    paths:
      include: ["*.sql"]
    metadata:
      engine_severity: high
      cwe: CWE-284
      category: access-control

  - id: firebase-rules-allow-all
    languages: [generic]
    severity: ERROR
    message: >-
      Firebase 보안 규칙이 조건 없이 모두 허용(if true)되어 있습니다. 로그인하지 않은 사람도 데이터를 읽고 쓸 수 있습니다.
      최소한 'request.auth != null' 조건과 본인 데이터만 접근하는 규칙으로 바꾸세요.
    pattern-regex: allow\s+[\w\s,]*:\s*if\s+true\s*;
    paths:
      include: ["*.rules", "firestore.rules", "storage.rules", "database.rules.json"]
    metadata:
      engine_severity: high
      cwe: CWE-284
      category: access-control
